<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#fff6d9">
    <meta name="format-detection" content="telephone=no, email=no, address=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>小游戏 1</title>
    <style>
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
        html{font-size:clamp(12px,12px + (100vw - 320px)/234,18px);-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%}
        body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei","微软雅黑","Hiragino Sans GB","Source Han Sans CN","Noto Sans CJK SC","Segoe UI",Roboto,Arial,sans-serif,system-ui,"Apple Color Emoji","Segoe UI Emoji";width:100vw;width:100dvw;min-height:100vh;min-height:100dvh;display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-box-align:center;-webkit-align-items:center;-ms-flex-align:center;align-items:center;-webkit-box-pack:center;-webkit-justify-content:center;-ms-flex-pack:center;justify-content:center;-webkit-transition:background .4s ease;transition:background .4s ease;overflow:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);line-height:1.6;word-break:break-word;overflow-wrap:break-word;-webkit-user-select:none;user-select:none;touch-action:manipulation}
        .cream-bg{background-color:#fff6d9}
        .black-bg{background-color:#000}
        .milk-bg{background-color:#fffdf8}
        .container{width:92%;max-width:820px;margin:0 auto;padding:1.5rem 0;text-align:center;display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-box-orient:vertical;-webkit-box-direction:normal;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;-webkit-box-align:center;-webkit-align-items:center;-ms-flex-align:center;align-items:center;-webkit-box-pack:center;-webkit-justify-content:center;-ms-flex-pack:center;justify-content:center;gap:1.25rem}
        .face-main{font-size:5.5rem;line-height:1;margin-bottom:.5rem;text-shadow:0 4px 10px rgba(0,0,0,.05)}
        .title-text{font-size:1.75rem;color:#333;font-weight:600;letter-spacing:.06em;margin-bottom:1rem}
        .btn-box{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-wrap:wrap;-ms-flex-wrap:wrap;flex-wrap:wrap;gap:1.25rem;-webkit-box-pack:center;-webkit-justify-content:center;-ms-flex-pack:center;justify-content:center;margin-top:1rem;width:100%}
        button{display:-webkit-inline-box;display:-webkit-inline-flex;display:-ms-inline-flexbox;display:inline-flex;-webkit-box-align:center;-webkit-align-items:center;-ms-flex-align:center;align-items:center;-webkit-box-pack:center;-webkit-justify-content:center;-ms-flex-pack:center;justify-content:center;min-height:52px;min-width:8.5rem;padding:.9rem 2rem;font-size:1.25rem;font-family:inherit;font-weight:600;color:#3a2d0d;border:none;border-radius:14px;cursor:pointer;background:#ffdd99;background:-webkit-linear-gradient(top,#ffe7b0,#ffdd99);background:linear-gradient(180deg,#ffe7b0 0%,#ffdd99 100%);-webkit-box-shadow:0 3px 8px rgba(255,170,60,.22);box-shadow:0 3px 8px rgba(255,170,60,.22);-webkit-transition:-webkit-transform .12s ease,background .2s ease,-webkit-box-shadow .2s ease;transition:transform .12s ease,background .2s ease,box-shadow .2s ease;white-space:nowrap;touch-action:manipulation;-webkit-appearance:none;-moz-appearance:none;appearance:none}
        @media (hover:hover) and (pointer:fine){button:hover{background:#ffcc66;background:-webkit-linear-gradient(top,#ffdb8a,#ffcc66);background:linear-gradient(180deg,#ffdb8a 0%,#ffcc66 100%);-webkit-transform:translateY(-2px) scale(1.03);transform:translateY(-2px) scale(1.03);-webkit-box-shadow:0 6px 14px rgba(255,170,60,.28);box-shadow:0 6px 14px rgba(255,170,60,.28)}}
        button:active{-webkit-transform:scale(.96);transform:scale(.96);-webkit-box-shadow:0 1px 3px rgba(255,170,60,.2);box-shadow:0 1px 3px rgba(255,170,60,.2)}
        button:focus{outline:3px solid rgba(255,204,102,.55);outline-offset:2px}
        .split-wrap{position:relative;width:100%;display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-box-orient:horizontal;-webkit-box-direction:normal;-webkit-flex-direction:row;-ms-flex-direction:row;flex-direction:row;-webkit-box-align:stretch;-webkit-align-items:stretch;-ms-flex-align:stretch;align-items:stretch;border-radius:18px;background:rgba(255,255,255,.35);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);padding:3.25rem .75rem 1.5rem;margin-top:.5rem;min-height:24rem;overflow:hidden}
        .split-line{position:absolute;left:50%;top:3rem;bottom:1rem;width:3px;-webkit-transform:translateX(-50%);-ms-transform:translateX(-50%);transform:translateX(-50%);background:-webkit-linear-gradient(top,rgba(68,68,68,.15),#444,rgba(68,68,68,.15));background:linear-gradient(180deg,rgba(68,68,68,.15),#444,rgba(68,68,68,.15));border-radius:2px}
        .split-middle-tip{position:absolute;top:.5rem;left:50%;-webkit-transform:translateX(-50%);-ms-transform:translateX(-50%);transform:translateX(-50%);background:#fff;color:#5a440e;padding:.5rem 1rem;font-size:1.05rem;font-weight:600;white-space:nowrap;max-width:96%;overflow:hidden;text-overflow:ellipsis;border-radius:999px;-webkit-box-shadow:0 2px 6px rgba(0,0,0,.08);box-shadow:0 2px 6px rgba(0,0,0,.08);z-index:2}
        .left-area,.right-area{-webkit-box-flex:1;-webkit-flex:1 1 50%;-ms-flex:1 1 50%;flex:1 1 50%;width:50%;padding:1rem .5rem;display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-box-orient:vertical;-webkit-box-direction:normal;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;-webkit-box-align:center;-webkit-align-items:center;-ms-flex-align:center;align-items:center;-webkit-box-pack:center;-webkit-justify-content:center;-ms-flex-pack:center;justify-content:center;gap:.75rem}
        .left-area{padding-right:1rem}
        .right-area{padding-left:1rem}
        .split-face{font-size:4.5rem;line-height:1;margin-bottom:.25rem}
        .split-desc{font-size:1.35rem;font-weight:600;color:#2d2d2d;margin-bottom:.5rem;max-width:100%;white-space:normal;padding:0 .25rem}
        .revive-box{color:#fff;font-size:1.6rem;font-weight:500;gap:2rem}
        .revive-box .like-heart{font-size:5rem;line-height:1;margin-top:1rem;cursor:pointer;display:inline-block;padding:.5rem 1rem;-webkit-user-select:none;user-select:none;-webkit-animation:heartBeat 1.6s ease-in-out infinite;animation:heartBeat 1.6s ease-in-out infinite;will-change:transform}
        @-webkit-keyframes heartBeat{0%,100%{-webkit-transform:scale(1)}50%{-webkit-transform:scale(1.12)}}
        @keyframes heartBeat{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
        .end-btn-group{margin-top:.25rem;display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-wrap:wrap;-ms-flex-wrap:wrap;flex-wrap:wrap;gap:1rem;-webkit-box-pack:center;-webkit-justify-content:center;-ms-flex-pack:center;justify-content:center;width:100%}
        #gameCanvas{width:100%;max-width:700px;height:auto;aspect-ratio:700/450;border:2px solid #ddd;background:#fff;border-radius:10px;-webkit-box-shadow:0 4px 14px rgba(0,0,0,.06);box-shadow:0 4px 14px rgba(0,0,0,.06);display:block;touch-action:none}
        .pad-wrap{display:none;width:100%;max-width:320px;margin:0 auto;margin-top:.25rem}
        .pad-row{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-box-pack:center;-webkit-justify-content:center;-ms-flex-pack:center;justify-content:center}
        .pad-btn{width:64px;height:64px;margin:4px;font-size:1.8rem;padding:0;min-width:0;min-height:0;border-radius:16px;background:#ffe7b0;-webkit-box-shadow:0 3px 6px rgba(0,0,0,.08);box-shadow:0 3px 6px rgba(0,0,0,.08)}
        .pad-btn:active{background:#ffcc66}
        .hide{display:none !important}
        @media (max-width:1023px){.container{max-width:92%}.face-main{font-size:4.8rem}.split-face{font-size:4rem}.split-desc{font-size:1.25rem}}
        @media (max-width:767px){.container{width:95%;padding:.5rem 0 1rem;gap:1rem}.face-main{font-size:4.2rem;margin-bottom:.25rem}.title-text{font-size:1.5rem;margin-bottom:.5rem}.btn-box{gap:.9rem;margin-top:.5rem}button{min-height:48px;padding:.75rem 1.5rem;font-size:1.05rem;min-width:7rem;border-radius:12px}.split-wrap{-webkit-box-orient:vertical;-webkit-box-direction:normal;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;padding:3.5rem 1rem .75rem;min-height:unset}.split-line{left:1rem;right:1rem;top:50%;bottom:auto;width:auto;height:3px;-webkit-transform:translateX(0) translateY(-50%);-ms-transform:translateX(0) translateY(-50%);transform:translateX(0) translateY(-50%);background:-webkit-linear-gradient(left,rgba(68,68,68,.15),#444,rgba(68,68,68,.15));background:linear-gradient(90deg,rgba(68,68,68,.15),#444,rgba(68,68,68,.15))}.split-middle-tip{top:.6rem;font-size:.95rem;padding:.4rem .85rem}.left-area,.right-area{width:100%;-webkit-flex-basis:50%;-ms-flex-preferred-size:50%;flex-basis:50%;padding:.5rem 0}.left-area{padding-right:0;padding-bottom:1.5rem}.right-area{padding-left:0;padding-top:1.5rem}.split-face{font-size:3.25rem}.split-desc{font-size:1.1rem;margin-bottom:.25rem}.revive-box{font-size:1.3rem;gap:1.25rem}.like-heart{font-size:4rem !important}.pad-wrap{display:block}}
        @media (max-width:479px){.face-main{font-size:3.6rem}.title-text{font-size:1.3rem}.split-face{font-size:2.8rem}.split-desc{font-size:1rem}.btn-box{gap:.7rem}button{padding:.7rem 1.2rem;font-size:1rem;min-width:6.2rem}.pad-btn{width:56px;height:56px;font-size:1.6rem}}
        @media (max-height:500px) and (orientation:landscape){body{padding:.25rem}.container{gap:.5rem;padding:.25rem 0}.face-main{font-size:3rem}.title-text{font-size:1.15rem;margin-bottom:.25rem}.split-wrap{min-height:unset;padding:2.75rem .5rem .5rem}.split-face{font-size:2.5rem}.split-desc{font-size:.95rem;margin-bottom:.1rem}button{min-height:42px;padding:.55rem 1.1rem;font-size:.95rem}.like-heart{font-size:3.5rem !important}}
    </style>
</head>
<body class="cream-bg">
    <div id="pageStart" class="container">
        <div class="face-main" aria-hidden="true">😗</div>
        <div class="title-text">小游戏 1</div>
        <div class="btn-box">
            <button type="button" onclick="startGame()">开始游玩</button>
            <button type="button" onclick="exitGame()">退出游戏</button>
        </div>
    </div>

    <div id="page1" class="container hide">
        <div class="split-wrap">
            <div class="split-line" aria-hidden="true"></div>
            <div class="split-middle-tip">老师来家访了，请选择你认为正确的选项</div>
            <div class="left-area">
                <div class="split-face" aria-hidden="true">🙂</div>
                <div class="split-desc">穿校服</div>
                <button type="button" onclick="selectRight1()">选择左边</button>
            </div>
            <div class="right-area">
                <div class="split-face" aria-hidden="true">😋</div>
                <div class="split-desc">穿COS服</div>
                <button type="button" onclick="selectWrong1()">选择右边</button>
            </div>
        </div>
    </div>

    <div id="page2" class="container hide">
        <div class="split-wrap">
            <div class="split-line" aria-hidden="true"></div>
            <div class="split-middle-tip">老师渴了，你要给他喝？</div>
            <div class="left-area">
                <div class="split-face" aria-hidden="true">🙂</div>
                <div class="split-desc">热水</div>
                <button type="button" onclick="selectRight2()">选择左边</button>
            </div>
            <div class="right-area">
                <div class="split-face" aria-hidden="true">😋</div>
                <div class="split-desc">酱油</div>
                <button type="button" onclick="selectWrong2()">选择右边</button>
            </div>
        </div>
    </div>

    <div id="page3" class="container hide">
        <div class="split-wrap">
            <div class="split-line" aria-hidden="true"></div>
            <div class="split-middle-tip">台风要来了，你选择</div>
            <div class="left-area">
                <div class="split-face" aria-hidden="true">🙂</div>
                <div class="split-desc">邀请老师在家避难</div>
                <button type="button" onclick="selectWrong3()">选择左边</button>
            </div>
            <div class="right-area">
                <div class="split-face" aria-hidden="true">😋</div>
                <div class="split-desc">让老师出去勇闯台风</div>
                <button type="button" onclick="selectRight3()">选择右边</button>
            </div>
        </div>
    </div>

    <div id="pageDead" class="container hide revive-box">
        <div>给我点个赞复活</div>
        <div class="like-heart" role="button" tabindex="0" onclick="reviveGame()" aria-label="点赞复活">❤️</div>
    </div>

    <div id="pageExit" class="container hide revive-box">
        <div>感谢游玩，再见！</div>
        <div class="end-btn-group">
            <button type="button" onclick="restartGame()">重新开始</button>
        </div>
    </div>

    <div id="pageWin" class="container hide">
        <canvas id="gameCanvas" width="700" height="450" aria-label="吃美食小游戏"></canvas>
        <div class="pad-wrap" aria-hidden="true">
            <div class="pad-row"><button type="button" class="pad-btn" data-dir="up">▲</button></div>
            <div class="pad-row">
                <button type="button" class="pad-btn" data-dir="left">◀</button>
                <button type="button" class="pad-btn" data-dir="down">▼</button>
                <button type="button" class="pad-btn" data-dir="right">▶</button>
            </div>
        </div>
        <div class="end-btn-group">
            <button type="button" onclick="restartGame()">再玩一次</button>
            <button type="button" onclick="exitGame()">通关退出</button>
        </div>
    </div>

    <script>
        var reviveCount = 2;
        var currentPage = "pageStart";
        var lastLevel = "page1";

        function switchPage(pageId) {
            var list = document.querySelectorAll(".container");
            for (var i = 0; i < list.length; i++) list[i].classList.add("hide");
            document.getElementById(pageId).classList.remove("hide");
            currentPage = pageId;
        }
        function setBg(className) { document.body.className = className; }
        function startGame() { setBg("cream-bg"); lastLevel = "page1"; switchPage("page1"); }
        function exitGame() { setBg("black-bg"); switchPage("pageExit"); }
        function deadProcess() { reviveCount--; setBg("black-bg"); switchPage("pageDead"); }
        function reviveGame() {
            if (reviveCount < 0) { safeAlert("复活次数用完，游戏退出"); exitGame(); return; }
            setBg("cream-bg"); switchPage(lastLevel);
        }
        function safeAlert(msg) { try { window.alert(msg); } catch (e) { console.log(msg); } }
        function selectRight1() { lastLevel = "page2"; switchPage("page2"); }
        function selectWrong1() { safeAlert("老师疑惑给家长打电话（全剧终）"); deadProcess(); }
        function selectRight2() { lastLevel = "page3"; switchPage("page3"); }
        function selectWrong2() { safeAlert("老师被酱油咸死了（全剧终）"); deadProcess(); }
        function selectWrong3() { safeAlert("老师觉得你胆小，再也不信你（全剧终）"); deadProcess(); }
        function selectRight3() { setBg("milk-bg"); switchPage("pageWin"); startEatGame(); }
        function restartGame() { reviveCount = 2; setBg("cream-bg"); gameRunning = false; switchPage("pageStart"); }

        var canvas, ctx;
        var dpr = 1;
        var LOG_W = 700, LOG_H = 450;
        var player = { x: 350, y: 225, size: 40 };
        var foodList = ["🍏","🥝","🍋","🍎","🍑","🍓","🍞","🥐","🥖","🧇","🍟","🍕"];
        var foods = [];
        var keyDown = {};
        var keyListenerBound = false;
        var padListenerBound = false;
        var gameRunning = false;
        var rafId = null;

        function fitCanvas() {
            if (!canvas) return;
            dpr = Math.max(1, window.devicePixelRatio || 1);
            canvas.width = LOG_W * dpr;
            canvas.height = LOG_H * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        function startEatGame() {
            canvas = document.getElementById("gameCanvas");
            ctx = canvas.getContext("2d");
            fitCanvas();
            player.x = LOG_W / 2;
            player.y = LOG_H / 2;
            foods = [];
            for (var i = 0; i < 15; i++) {
                foods.push({
                    text: foodList[Math.floor(Math.random() * foodList.length)],
                    x: Math.random() * (LOG_W - 50) + 25,
                    y: Math.random() * (LOG_H - 50) + 25,
                    size: 36
                });
            }
            if (!keyListenerBound) {
                window.addEventListener("keydown", function (e) {
                    if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(e.key) >= 0) {
                        keyDown[e.key] = true; e.preventDefault();
                    }
                }, { passive: false });
                window.addEventListener("keyup", function (e) {
                    if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(e.key) >= 0) {
                        keyDown[e.key] = false; e.preventDefault();
                    }
                }, { passive: false });
                keyListenerBound = true;
            }
            if (!padListenerBound) {
                var padBtns = document.querySelectorAll(".pad-btn");
                for (var j = 0; j < padBtns.length; j++) (function (btn) {
                    var dirMap = { up:"ArrowUp", down:"ArrowDown", left:"ArrowLeft", right:"ArrowRight" };
                    var key = dirMap[btn.getAttribute("data-dir")];
                    function press() { if (key) keyDown[key] = true; }
                    function release() { if (key) keyDown[key] = false; }
                    btn.addEventListener("touchstart", function (e) { e.preventDefault(); press(); }, { passive: false });
                    btn.addEventListener("touchend", function (e) { e.preventDefault(); release(); }, { passive: false });
                    btn.addEventListener("touchcancel", function (e) { e.preventDefault(); release(); }, { passive: false });
                    btn.addEventListener("mousedown", press);
                    btn.addEventListener("mouseup", release);
                    btn.addEventListener("mouseleave", release);
                })(padBtns[j]);
                padListenerBound = true;
            }
            if (startEatGame._resizeBound) window.removeEventListener("resize", startEatGame._resizeBound);
            startEatGame._resizeBound = function () { fitCanvas(); };
            window.addEventListener("resize", startEatGame._resizeBound);
            gameRunning = true;
            if (rafId) cancelAnimationFrame(rafId);
            gameLoop();
        }

        function gameLoop() {
            if (!gameRunning) { rafId = null; return; }
            rafId = requestAnimationFrame(gameLoop);
            ctx.clearRect(0, 0, LOG_W, LOG_H);
            var speed = 4;
            if (keyDown["ArrowUp"] && player.y > 10) player.y -= speed;
            if (keyDown["ArrowDown"] && player.y < LOG_H - 10) player.y += speed;
            if (keyDown["ArrowLeft"] && player.x > 10) player.x -= speed;
            if (keyDown["ArrowRight"] && player.x < LOG_W - 10) player.x += speed;
            for (var i = foods.length - 1; i >= 0; i--) {
                var food = foods[i];
                ctx.font = food.size + "px -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif, 'Apple Color Emoji'";
                ctx.textAlign = "left";
                ctx.textBaseline = "top";
                ctx.fillText(food.text, food.x, food.y);
                var dx = player.x - (food.x + 16);
                var dy = player.y - (food.y + 16);
                var dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < 34) foods.splice(i, 1);
            }
            ctx.font = player.size + "px -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif, 'Apple Color Emoji'";
            ctx.textAlign = "left";
            ctx.textBaseline = "top";
            ctx.fillText("🥳", player.x - 20, player.y - 20);
            if (foods.length === 0) {
                ctx.fillStyle = "#222";
                ctx.font = "bold 30px -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText("全部美食吃完，通关成功！", LOG_W / 2, LOG_H / 2);
                gameRunning = false;
                rafId = null;
                return;
            }
        }

        (function () {
            var heart = document.querySelector(".like-heart");
            if (heart) {
                heart.addEventListener("keydown", function (e) {
                    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); reviveGame(); }
                });
            }
        })();
    </script>
</body>
</html>
