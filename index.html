<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 60px;
        }

        .title {
            font-size: 96px;
            font-weight: bold;
            letter-spacing: 12px;
            text-align: center;
            user-select: none;
        }

        .test-area {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .test-btn {
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 16px 48px;
            font-size: 28px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
        }

        .test-btn:hover {
            background-color: #dddddd;
            transform: translateY(-2px);
        }

        .test-btn:active {
            transform: translateY(0);
        }

        .counter {
            font-size: 48px;
            font-weight: bold;
            min-width: 80px;
            text-align: left;
            color: #4CAF50;
        }
    </style>
</head>
<body>
    <div class="title">测试主页</div>

    <div class="test-area">
        <button class="test-btn" id="testBtn">测试功能</button>
        <div class="counter" id="counter">0</div>
    </div>

    <script>
        const btn = document.getElementById('testBtn');
        const counter = document.getElementById('counter');
        let count = 0;

        btn.addEventListener('click', function () {
            count++;
            counter.textContent = count;
        });
    </script>
</body>
</html>
